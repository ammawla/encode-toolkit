name: Pipelines

# Checks for the Nextflow pipeline skills. None of these need reference genomes:
#   validate  lint + `nextflow run -preview` + profile resolution for every pipeline
#   images    build each pipeline's Dockerfile and confirm the tools its workflow calls exist
#   environments  dry-run solve of every conda environment file
#   scripts   shellcheck the installer scripts and keep skills/ and plugin/skills/ identical

on:
  push:
    branches: [main]
    paths:
      - "skills/pipeline-*/**"
      - "skills/bioinformatics-installer/scripts/**"
      - "skills/bioinformatics-installer/environments/**"
      - "plugin/skills/**"
      - ".github/workflows/pipelines.yml"
      - ".github/scripts/preview-pipelines.sh"
  pull_request:
    branches: [main]
    paths:
      - "skills/pipeline-*/**"
      - "skills/bioinformatics-installer/scripts/**"
      - "skills/bioinformatics-installer/environments/**"
      - "plugin/skills/**"
      - ".github/workflows/pipelines.yml"
      - ".github/scripts/preview-pipelines.sh"

permissions:
  contents: read

jobs:
  validate:
    name: Lint and preview workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Use the repository's own installer so CI also proves that the pinned,
      # checksum-verified install works.
      - name: Install Nextflow with the bundled installer
        run: |
          bash skills/bioinformatics-installer/scripts/install-nextflow.sh --docker
          nextflow -version

      - name: Lint, preview, and resolve profiles
        run: bash .github/scripts/preview-pipelines.sh

  images:
    name: Build ${{ matrix.pipeline }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline: atacseq
            tools: fastqc trim_galore bowtie2 samtools picard bedtools macs2 idr alignmentSieve bamCoverage multiqc
            smoke: >-
              samtools --version | head -1 && macs2 --version && idr --version && echo 'scale=2; 1/3' | bc
          - pipeline: chipseq
            tools: fastqc trim_galore bwa samtools picard bedtools macs2 idr bedGraphToBigWig multiqc
            smoke: >-
              bwa 2>&1 | grep -q Version && macs2 --version && idr --version
          - pipeline: cutandrun
            tools: fastqc trim_galore bowtie2 samtools picard bedtools SEACR_1.3.sh macs2 bamCoverage multiqc
            smoke: >-
              ! (picard MarkDuplicates --version 2>&1 | grep -q UnsupportedClassVersionError) && test -e "$(dirname "$(command -v SEACR_1.3.sh)")/SEACR_1.3.R" && Rscript --version && bamCoverage --version
          - pipeline: dnaseseq
            tools: fastqc trim_galore bwa samtools picard bedtools bc hotspot2.sh extractCenterSites.sh hotspot2_part1 modwt unstarch sort-bed bedGraphToBigWig rgt-hint multiqc
            smoke: >-
              ! (picard MarkDuplicates --version 2>&1 | grep -q UnsupportedClassVersionError) && hotspot2.sh -h 2>&1 | grep -q Usage && extractCenterSites.sh -h 2>&1 | grep -q Usage && rgt-hint --version
          - pipeline: hic
            tools: fastqc bwa samtools pairtools cooler java multiqc
            smoke: >-
              pairtools --version && cooler --version && java -jar /opt/juicer_tools.jar -V 2>&1 | head -2
          - pipeline: rnaseq
            tools: fastqc trim_galore STAR rsem-calculate-expression kallisto samtools bedGraphToBigWig infer_experiment.py multiqc
            smoke: >-
              STAR --version && rsem-calculate-expression --version && kallisto version
          - pipeline: wgbs
            tools: fastqc trim_galore bismark deduplicate_bismark bowtie2 samtools MethylDackel bgzip tabix multiqc
            smoke: >-
              MethylDackel --version && bismark --version | grep -i version && bowtie2 --version | head -1
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        env:
          PIPELINE: ${{ matrix.pipeline }}
        run: docker build -t "encode-toolkit/pipeline-${PIPELINE}:ci" "skills/pipeline-${PIPELINE}/scripts"

      - name: Check that every tool the workflow calls is on the PATH
        env:
          PIPELINE: ${{ matrix.pipeline }}
          TOOLS: ${{ matrix.tools }}
        run: |
          missing=0
          for tool in $TOOLS; do
            if docker run --rm "encode-toolkit/pipeline-${PIPELINE}:ci" bash -c "command -v $tool" > /dev/null; then
              echo "ok      $tool"
            else
              echo "MISSING $tool"; missing=1
            fi
          done
          exit $missing

      # Presence is not enough: a tool can be on the PATH and still fail to start
      # (wrong Java version, missing shared library, missing helper script).
      - name: Check that the key tools actually run
        env:
          PIPELINE: ${{ matrix.pipeline }}
          SMOKE: ${{ matrix.smoke }}
        run: docker run --rm "encode-toolkit/pipeline-${PIPELINE}:ci" bash -euo pipefail -c "$SMOKE"

  environments:
    name: Solve conda environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: none

      # A dry run resolves every pinned package without installing anything, which catches
      # pins that do not exist or cannot be installed together.
      - name: Dry-run solve every environment file
        run: |
          failed=0
          for file in skills/bioinformatics-installer/environments/*.yml; do
            if micromamba create --dry-run --yes --name solve-check --file "$file" > solve.log 2>&1; then
              echo "ok    $(basename "$file")"
            else
              echo "FAIL  $(basename "$file")"; grep -E "does not exist|not installable|conflict" solve.log | head -8 | sed 's/^/        /'
              failed=1
            fi
          done
          exit $failed

  scripts:
    name: Installer scripts and skill copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck skills/bioinformatics-installer/scripts/*.sh .github/scripts/*.sh

      - name: skills/ and plugin/skills/ must be identical
        run: diff -r skills plugin/skills
